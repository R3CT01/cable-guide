# Put this file in your GitHub repo at .github/workflows/guide.yml
# Also put build_guide.py in the repo root. Nothing else is needed.
# Every 6 hours it rebuilds guide/guide-N.xml and commits it, so the plugin's guide stays current.
name: Update guide
on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch: {}
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build trimmed guide files
        run: |
          python3 build_guide.py \
            --m3u https://iptv-org.github.io/iptv/countries/us.m3u \
            --m3u https://iptv-org.github.io/iptv/categories/news.m3u \
            --xml https://epgshare01.online/epgshare01/epg_ripper_US2.xml.gz \
            --xml https://i.mjh.nz/PlutoTV/us.xml.gz \
            --xml https://i.mjh.nz/Plex/us.xml.gz \
            --hours-ahead 24 \
            --out guide
      - name: Commit
        run: |
          git config user.name "guide-bot"
          git config user.email "guide-bot@users.noreply.github.com"
          git add guide
          git diff --cached --quiet || (git commit -m "Update guide" && git push)
